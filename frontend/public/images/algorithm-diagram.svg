<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="360" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Grid lines -->
  <path d="M 50 180 L 750 180 M 200 50 L 200 310 M 400 50 L 400 310 M 600 50 L 600 310" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Title -->
  <text x="50" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">📊 Алгоритмын Моделийн Диаграм (Algorithm State Space)</text>
  <text x="50" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Төлөвийн шилжилт ба язгуур оновчлолын харагдах байдал</text>

  <!-- Node 1: Input -->
  <g transform="translate(100, 180)">
    <circle r="40" fill="url(#cyanGrad)" filter="url(#glow)" />
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">N = 10⁹</text>
    <text x="0" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Оролт (Input)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 155 180 L 320 180" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="6,6" />
  <text x="240" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Хуваагч шалгах</text>

  <!-- Node 2: Math Filter √N -->
  <g transform="translate(400, 180)">
    <rect x="-65" y="-45" width="130" height="90" rx="18" fill="url(#purpleGrad)" filter="url(#glow)" />
    <text x="0" y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="black" text-anchor="middle">i × i ≤ N</text>
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">O(√N) Шалгуур</text>
    <text x="0" y="65" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">31,622 алхам</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 480 180 L 640 180" stroke="#10b981" stroke-width="3" />

  <!-- Node 3: Result -->
  <g transform="translate(700, 180)">
    <circle r="40" fill="#10b981" filter="url(#glow)" />
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ACCEPTED</text>
    <text x="0" y="60" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">0.001 сек ⚡</text>
  </g>
</svg>
