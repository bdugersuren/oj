# Production secret-file override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# Create every referenced file outside version control with mode 0600 first.
services:
  api:
    env_file: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      SECRET_KEY_FILE: /run/secrets/secret_key
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DATABASE_URL_FILE: /run/secrets/database_url
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: &backend_secrets
      - secret_key
      - encryption_key
      - database_url
      - minio_root_user
      - minio_root_password

  migrate:
    env_file: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      SECRET_KEY_FILE: /run/secrets/secret_key
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DATABASE_URL_FILE: /run/secrets/database_url
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: *backend_secrets

  celery:
    env_file: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      SECRET_KEY_FILE: /run/secrets/secret_key
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DATABASE_URL_FILE: /run/secrets/database_url
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: *backend_secrets

  db:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  minio:
    environment:
      MINIO_ROOT_USER: !reset null
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD: !reset null
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password

  pgadmin:
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: !reset null
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_default_password
    secrets:
      - pgadmin_default_password

secrets:
  secret_key:
    file: ${OJ_SECRET_DIR:-./secrets}/secret_key
  encryption_key:
    file: ${OJ_SECRET_DIR:-./secrets}/encryption_key
  database_url:
    file: ${OJ_SECRET_DIR:-./secrets}/database_url
  postgres_password:
    file: ${OJ_SECRET_DIR:-./secrets}/postgres_password
  minio_root_user:
    file: ${OJ_SECRET_DIR:-./secrets}/minio_root_user
  minio_root_password:
    file: ${OJ_SECRET_DIR:-./secrets}/minio_root_password
  pgadmin_default_password:
    file: ${OJ_SECRET_DIR:-./secrets}/pgadmin_default_password
