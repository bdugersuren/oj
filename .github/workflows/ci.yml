name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oj_db
          POSTGRES_USER: oj_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oj_user -d oj_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://oj_user:test-password@localhost:5432/oj_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python scripts/bootstrap_database.py
      - run: alembic current
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      MINIO_ROOT_PASSWORD: ci-minio-password
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable base images
        run: |
          unpinned="$(rg '^FROM ' --glob 'Dockerfile*' | rg -v '@sha256:' || true)"
          if [ -n "$unpinned" ]; then
            echo "Unpinned Docker base image(s):"
            echo "$unpinned"
            exit 1
          fi
      - run: docker compose config --quiet
      - run: docker compose --profile judge config --quiet
      - run: docker compose --profile ai --profile ops --profile admin-tools config --quiet
