# Rate limiting zone for API requests (10 requests per second, with burst of 20)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# WebSocket connection mapping for upstream proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server nextjs:3000 resolve;
}

upstream backend_upstream {
    zone backend_upstream 64k;
    server fastapi:8000 resolve;
}

upstream minio_upstream {
    zone minio_upstream 64k;
    server minio:9000 resolve;
}

upstream minio_console_upstream {
    zone minio_console_upstream 64k;
    server minio:9001 resolve;
}

# Main OJ Platform (Frontend & Backend API)
server {
    listen 80;
    server_name oj.know.mn localhost 127.0.0.1;

    # Security Headers for production hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # Backend REST API & Swagger Docs (Rate-limited)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for long running API requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # WebSockets (Realtime Judging Events & scoreboards)
    location /api/v1/ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Single Page App (Next.js)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# MinIO Object Storage Console & API
server {
    listen 80;
    server_name minio.oj.know.mn;

    location / {
        proxy_pass http://minio_console_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
