services:
  # 1. Frontend Single Page Application (Next.js 15)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    container_name: oj-nextjs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    mem_limit: 1g

    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - oj-network

  # 2. Backend REST API Gateway (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj-fastapi
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 1g
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - oj-network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj-migrate
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    pids_limit: 128
    mem_limit: 512m
    command: python scripts/bootstrap_database.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - oj-network

  # 3. PostgreSQL Database
  db:
    build:
      context: ./config/postgres
      dockerfile: Dockerfile
    container_name: oj-postgres
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oj_db}
      POSTGRES_USER: ${POSTGRES_USER:-oj_user}
      # Empty direct value makes the base stack fail closed in PostgreSQL;
      # docker-compose.secrets.yml removes it and supplies *_FILE instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oj_user} -d ${POSTGRES_DB:-oj_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oj-network

  # 4. Redis Caching, WebSocket PubSub & Task Queue
  redis:
    build:
      context: ./config/redis
      dockerfile: Dockerfile
    container_name: oj-redis
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 512m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oj-network
      - judge-network

  # 5. MinIO Object Storage (Problem Statements, PDFs, Testcases, Assets)
  minio:
    build:
      context: ./config/minio
      dockerfile: Dockerfile
    container_name: oj-minio
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 2g
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      # Empty direct value makes the base stack fail closed in MinIO;
      # docker-compose.secrets.yml removes it and supplies *_FILE instead.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - miniodata:/data
    networks:
      - oj-network

  # 6. Celery Async Task Worker (Grading Dispatcher & PDF Reporting)
  celery:
    profiles: ["judge"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj-celery
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 512
    mem_limit: 2g
    command: celery -A app.core.celery_app worker --loglevel=info -Q judge_queue,celery --concurrency=4
    env_file:
      - .env
    environment:
      ENABLE_JUDGE: "true"
    volumes:
      - problems_data:/problems
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      bridge1:
        condition: service_healthy
      bridge2:
        condition: service_healthy
    networks:
      - oj-network
      - judge-network

  # 7. DMOJ tier-3 Judge Bridge Replicas (Isolated via cpuset)
  bridge1:
    profiles: ["judge"]
    build:
      context: ./judge/bridge
      dockerfile: Dockerfile
    image: oj-dmoj-tier3
    container_name: oj-dmoj-bridge-1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_PTRACE
    pids_limit: 512
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/env/bin/python3", "-c", "import socket,struct; s=socket.create_connection(('127.0.0.1',9999),2); p=b'{\"health\":true}'; s.sendall(struct.pack('!I',len(p))+p); assert len(s.recv(4))==4"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpuset: "0"  # Pinned to CPU Core 0
    volumes:
      - ./judge/judge-tier3/judge.yml:/judge/judge.yml:ro
      - problems_data:/problems
    networks:
      - judge-network

  bridge2:
    profiles: ["judge"]
    build:
      context: ./judge/bridge
      dockerfile: Dockerfile
    image: oj-dmoj-tier3
    container_name: oj-dmoj-bridge-2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_PTRACE
    pids_limit: 512
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/env/bin/python3", "-c", "import socket,struct; s=socket.create_connection(('127.0.0.1',9999),2); p=b'{\"health\":true}'; s.sendall(struct.pack('!I',len(p))+p); assert len(s.recv(4))==4"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpuset: "1"  # Pinned to CPU Core 1
    volumes:
      - ./judge/judge-tier3/judge.yml:/judge/judge.yml:ro
      - problems_data:/problems
    networks:
      - judge-network

  # Nginx Proxy Manager (NPM)
  npm:
    profiles: ["ops"]
    build:
      context: ./config/npm-build
      dockerfile: Dockerfile
    container_name: oj-npm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    ports:
      - '80:80'
      - '127.0.0.1:81:81'
      - '443:443'
    volumes:
      - npmdata:/data
      - npmletsencrypt:/etc/letsencrypt
    depends_on:
      - web
      - api
      - minio
    networks:
      - oj-network

  # 8. Ollama Local LLM Service
  ollama:
    profiles: ["ai", "admin-tools"]
    build:
      context: ./config/ollama
      dockerfile: Dockerfile
    container_name: oj-ollama
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - oj-network

  # 9. Open WebUI (AI testing & prompt management)
  open-webui:
    profiles: ["admin-tools"]
    build:
      context: ./config/open-webui
      dockerfile: Dockerfile
    container_name: oj-open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      CORS_ALLOW_ORIGIN: ${OPEN_WEBUI_CORS_ORIGINS:-http://127.0.0.1:3001}
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${OPEN_WEBUI_EMBEDDING_MODEL:-nomic-embed-text}
      UVICORN_WORKERS: "1"
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - openwebuidata:/app/backend/data
    depends_on:
      - ollama
    networks:
      - oj-network

  # 10. Qdrant Vector Database
  qdrant:
    profiles: ["ai"]
    build:
      context: ./config/qdrant
      dockerfile: Dockerfile
    container_name: oj-qdrant
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - oj-network

  # 11. pgAdmin (PostgreSQL Database viewer tool)
  pgadmin:
    profiles: ["admin-tools"]
    build:
      context: ./config/pgadmin
      dockerfile: Dockerfile
    container_name: oj-pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_LISTEN_PORT: "8080"
    ports:
      - "127.0.0.1:5050:8080"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - oj-network

networks:
  oj-network:
    driver: bridge
  judge-network:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  problems_data:
  ollamadata:
  openwebuidata:
  qdrantdata:
  pgadmindata:
  npmdata:
  npmletsencrypt:
